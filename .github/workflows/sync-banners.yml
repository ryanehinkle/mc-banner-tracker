name: Sync banner collection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-banners.yml"
      - "scripts/sync_banners.py"
  schedule:
    - cron: "16,46 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banner-storage
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Initialize or back up shared banners
        run: python3 scripts/sync_banners.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A storage.json banners.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync shared banner collection"
            git push
          fi
